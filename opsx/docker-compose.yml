services:
  postgres:
    image: postgres:16-alpine
    container_name: humworld-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-humworld}
      POSTGRES_USER: ${POSTGRES_USER:-humworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-humworld}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    container_name: humworld-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://humworld:humworld@postgres:5432/humworld}
      CAPTURE_SCHEDULER_ENABLED: ${CAPTURE_SCHEDULER_ENABLED:-true}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    container_name: humworld-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
