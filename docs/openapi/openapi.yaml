          title: Duplicates
        invalid:
          type: integer
          title: Invalid
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - source_id
      - inserted
      - duplicates
      - invalid
      - error
      title: CaptureSourceResponse
