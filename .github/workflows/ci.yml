name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  credentials-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PostgreSQL secret availability
        env:
          CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: python3 opsx/ci_database_env.py --check

  docker-compose-check:
    needs: credentials-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: humworld_test
          POSTGRES_USER: humworld
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U humworld -d humworld_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare masked database connections
        env:
          CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: python opsx/ci_database_env.py

      - name: Validate Docker Compose configuration
        run: DATABASE_URL="$COMPOSE_DATABASE_URL" docker compose -f opsx/docker-compose.yml config --quiet

      - name: Validate generated OpenSpec contracts
        run: python opsx/sync_contracts.py --check

      - name: Verify credential configuration
        env:
          RUN_DOCKER_CREDENTIAL_TESTS: "1"
        run: python -m unittest discover -s opsx/tests -v

      - name: Install backend Python dependencies
        shell: bash
        run: |
          if [ ! -f backend/requirements.txt ]; then
            echo "backend/requirements.txt not found; backend Python tests cannot run yet."
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest pytest-cov

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Frontend quality check
        shell: bash
        run: |
          if [ ! -f frontend/package.json ]; then
            echo "frontend/package.json not found; skipping frontend quality check."
            exit 0
          fi

          if ! node -e "const p = require('./frontend/package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            echo "frontend lint script not found; skipping frontend quality check."
            exit 0
          fi

          cd frontend
          pnpm install --frozen-lockfile
          pnpm run lint

      - name: Apply backend migrations
        shell: bash
        run: |
          if [ ! -f backend/requirements.txt ]; then
            echo "backend/requirements.txt not found; no backend migrations to apply yet."
            exit 0
          fi

          cd backend
          if [ -f alembic.ini ]; then
            alembic upgrade head
          else
            echo "No backend migration mechanism found; skipping migration step."
          fi

      - name: Backend tests
        shell: bash
        run: |
          if [ ! -f backend/requirements.txt ]; then
            echo "backend/requirements.txt not found; backend Python tests cannot run yet."
            exit 0
          fi

          test_file="$(find backend -maxdepth 3 \( -name 'test_*.py' -o -name '*_test.py' \) | head -n 1)"

          if [ ! -d backend/tests ] && [ -z "$test_file" ]; then
            echo "No backend pytest test surface found; skipping backend tests until tests exist."
            exit 0
          fi

          cd backend
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80

      - name: Frontend tests
        shell: bash
        run: |
          if [ ! -f frontend/package.json ]; then
            echo "frontend/package.json not found; skipping frontend tests."
            exit 0
          fi

          if ! node -e "const p = require('./frontend/package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            echo "frontend test script not found; skipping frontend tests."
            exit 0
          fi

          cd frontend
          pnpm install --frozen-lockfile
          pnpm test

      - name: Frontend build
        working-directory: frontend
        run: pnpm run build

      - name: Build Docker services
        run: DATABASE_URL="$COMPOSE_DATABASE_URL" docker compose -f opsx/docker-compose.yml build
